options:
  match-access-ml-pipeline-only:
    type: boolean
    default: false
    description: |
      Only invoke the webhook for pods labelled access-ml-pipeline="true".
      This avoids making unrelated pods depend on the PodDefault webhook while
      preserving opt-in access to Kubeflow Pipelines.
  port:
    type: int
    default: 4443
    description: Webhook server port
