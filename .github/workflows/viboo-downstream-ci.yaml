name: Viboo downstream CI

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: pipx install tox
      - run: tox -vve lint
      - run: tox -vve unit

  build:
    name: Pack charm
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v38.0.0
    with:
      path-to-charm-directory: .
      cache: false
    permissions:
      actions: read
      contents: read
